<!DOCTYPE html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Bookshelf App</title>

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;600&family=IBM+Plex+Sans:wght@400;600&display=swap"
      rel="stylesheet"
    />

    <link rel="stylesheet" href="./styles/tokens.css" />
    <link rel="stylesheet" href="./styles/base.css" />
    <link rel="stylesheet" href="./styles/main.css" />
  </head>
  <body>
    <main>
      <h1 id="main-title">Bookshelf App</h1>

      <section class="panel">
        <h2 class="panel-title">Tambah Buku Baru</h2>
        <form id="bookForm" data-testid="bookForm">
          <div class="field">
            <label for="bookFormTitle">Judul</label>
            <input
              name="title"
              id="bookFormTitle"
              type="text"
              required
              data-testid="bookFormTitleInput"
            />
          </div>
          <div class="field">
            <label for="bookFormAuthor">Penulis</label>
            <input
              name="author"
              id="bookFormAuthor"
              type="text"
              required
              data-testid="bookFormAuthorInput"
            />
          </div>
          <div class="field">
            <label for="bookFormYear">Tahun</label>
            <input
              name="year"
              id="bookFormYear"
              type="number"
              required
              data-testid="bookFormYearInput"
            />
          </div>
          <div class="checkbox-field">
            <input
              name="isComplete"
              id="bookFormIsComplete"
              type="checkbox"
              data-testid="bookFormIsCompleteCheckbox"
            />
            <label for="bookFormIsComplete">Selesai dibaca</label>
          </div>
          <button
            id="bookFormSubmit"
            type="submit"
            data-testid="bookFormSubmitButton"
            class="btn-primary"
          >
            Masukkan Buku: <span id="isCompleteStatus" class="status-hint">Belum Selesai Dibaca</span>
          </button>
        </form>
      </section>

      <section class="panel">
        <h2 class="panel-title">Cari Buku</h2>
        <form id="searchBook" data-testid="searchBookForm">
          <label for="searchBookTitle">Judul</label>
          <div class="search-group">
            <input
              id="searchBookTitle"
              type="search"
              data-testid="searchBookFormTitleInput"
            />
            <button id="searchSubmit" type="submit" data-testid="searchBookFormSubmitButton" class="btn-primary">
              Cari
            </button>
          </div>
        </form>
        <div id="searchBookResultList"></div>
      </section>

      <section class="panel">
        <h2 class="panel-title">Belum selesai dibaca</h2>
        <div id="incompleteBookList" data-testid="incompleteBookList" class="shelf"></div>
      </section>

      <section class="panel">
        <h2 class="panel-title">Selesai dibaca</h2>
        <div id="completeBookList" data-testid="completeBookList" class="shelf"></div>
      </section>
    </main>

    <!-- Book card template — structure follows the required data-testid spec exactly -->
    <template id="bookCardTemplate">
      <article data-testid="bookItem" class="book-article">
        <h3 data-testid="bookItemTitle" class="book-title"></h3>
        <p data-testid="bookItemAuthor" class="book-meta">
          <span class="book-meta-label">Penulis:</span>
          <span class="book-author"></span>
        </p>
        <p data-testid="bookItemYear" class="book-meta">
          <span class="book-meta-label">Tahun:</span>
          <span class="book-year"></span>
        </p>
        <div class="book-actions">
          <button data-testid="bookItemIsCompleteButton" class="book-status" type="button">
            <span class="book-status-text"></span>
          </button>
          <button data-testid="bookItemDeleteButton" class="book-delete" type="button">Hapus</button>
          <button data-testid="bookItemEditButton" class="book-edit" type="button">Edit</button>
        </div>
      </article>
    </template>

    <!-- Edit modal — hand-rolled, no framework JS -->
    <div id="editBookModal" class="modal-overlay" hidden>
      <div class="modal-dialog" role="dialog" aria-modal="true" aria-labelledby="editModalTitle">
        <div class="modal-header">
          <h2 id="editModalTitle">Edit Buku</h2>
          <button type="button" id="editModalCloseButton" class="modal-close" aria-label="Tutup">&times;</button>
        </div>
        <form id="editBookForm">
          <div class="modal-body">
            <div class="field">
              <label for="editBookFormTitle">Judul</label>
              <input name="title" id="editBookFormTitle" type="text" required />
            </div>
            <div class="field">
              <label for="editBookFormAuthor">Penulis</label>
              <input name="author" id="editBookFormAuthor" type="text" required />
            </div>
            <div class="field">
              <label for="editBookFormYear">Tahun</label>
              <input name="year" id="editBookFormYear" type="number" required />
            </div>
            <div class="checkbox-field">
              <input name="isComplete" id="editBookFormIsComplete" type="checkbox" />
              <label for="editBookFormIsComplete">Selesai dibaca</label>
            </div>
          </div>
          <div class="modal-footer">
            <button type="button" id="editModalCancelButton" class="btn-secondary">Keluar</button>
            <button type="submit" class="btn-primary">Simpan Perubahan</button>
          </div>
        </form>
      </div>
    </div>

    <p id="status-message" hidden></p>

    <script type="module" src="./scripts/main.js"></script>
  </body>
</html>
